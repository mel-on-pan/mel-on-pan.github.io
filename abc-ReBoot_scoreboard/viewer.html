<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- js/css を更新したら ?v= の数字を上げる (スマホのキャッシュ対策) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>問題ビューア</title>
  <link rel="stylesheet" href="css/viewer.css?v=10">
</head>
<body>
  <header id="vheader" class="vheader">
    <nav id="tabs" class="tabs" role="tablist">
      <button id="tabQ" class="tab active" role="tab" aria-selected="true" data-tab="q">問題</button>
      <button id="tabB" class="tab" role="tab" aria-selected="false" data-tab="b">スコアボード</button>
    </nav>
    <div class="conn"><span id="connDot" class="dot"></span><span id="connText">接続中…</span></div>
  </header>

  <div id="paneB" class="boardpane" hidden>
    <div id="boardStage" class="boardstage"><iframe id="boardFrame" class="boardframe" title="スコアボード"></iframe></div>
  </div>

  <main id="paneQ" class="vmain">
    <div class="qmeta">
      <span id="qno" class="qno"></span>
      <span id="rule" class="rule"></span>
    </div>

    <article id="current" class="qcard">
      <p id="question" class="question waiting">運営に接続しています…</p>
      <section id="answerBox" class="answer" hidden>
        <div class="alabel">正解</div>
        <div id="answer" class="atext"></div>
        <p id="explanation" class="expl" hidden></p>
      </section>
    </article>

    <section id="historyBox" class="history" hidden>
      <h2 class="history-head">直前の問題</h2>
      <ol id="history" class="history-list"></ol>
    </section>
  </main>

  <script src="js/config.js?v=10"></script>
  <script src="js/core.js?v=10"></script>
  <script src="js/viewer.js?v=10"></script>
</body>
</html>
